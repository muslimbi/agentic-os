[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.1.0"
description = "A hierarchical multi-agent orchestration prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agentic OS" }]
license = { text = "GPL-3.0-or-later" }

[project.scripts]
agentic-os = "agentic_os.cli:main"
agentic-os-web = "agentic_os.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_os = ["static/*.html"]
