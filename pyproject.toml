[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.1.0"
description = "A hierarchical multi-agent orchestration prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agentic OS" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
agentic-os = "agentic_os.cli:main"
agentic-os-web = "agentic_os.web:main"
agentic-os-server = "agentic_os.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_os = ["static/*.html"]

[tool.setuptools.data-files]
"share/agentic-os/dashboard" = [
    "dashboard/index.html",
    "dashboard/app.js",
    "dashboard/api.js",
    "dashboard/utils.js",
    "dashboard/styles.css",
]
"share/agentic-os/dashboard/pages" = ["dashboard/pages/*.js"]
